<script type="application/ld+json">{"@type": "JobPosting", "title": "Production Systems Engineer, Edge", "description": "Meta's Edge compute fleet - around 162,000 servers in more than 600 locations worldwide - is how our users reach us.  Unlike most of Meta's hardware, this fleet doesn't run in our own data centers: it lives in Edge PoPs terminating user connections, and in ISP and cell-service-provider locations running caching for partner networks.\n\nThe Edge Hardware team is the hardware engineering partner to the Traffic organization that owns this footprint.  We are a key partner in hardware selection and qualification, qualify firmware across every component, investigate failures in the deployed fleet, and define the detection and remediation tooling that keeps it healthy.  The work sits directly in the user path: a hardware fault we miss becomes a user-visible availability problem.\n\n  You'd work day to day with an engineer being hired alongside you, and with the team in Dublin who owns the area today - plus the wider Edge and hardware reliability teams, and your Traffic partners, on both coasts.\n", "responsibilities": "As a Production Systems Engineer on Edge Hardware, you'll contribute across New Product Introduction and Sustaining work on Meta's Edge compute fleet, taking ownership of well-defined areas and growing your scope as you ramp&nbsp;Qualify successive server generations and new platforms into the fleet, and sustain existing generations for the 3–5 years they remain deployed&nbsp;Build out failure detection and remediation coverage - new checks, porting existing validation to new vendor hardware, cleaning up noisy checkers that currently create work for partner operations teams&nbsp;Help requalify components that have reached end of sale (new NICs, SSDs), unblocking Meta's ability to purchase Edge servers and replace failed parts&nbsp;Improve fleet visibility, surfacing failures we currently detect late or not at all&nbsp;Take on part of the firmware qualification cadence - NIC, BIOS, BMC, management engine, GPU VBIOS, PSU, flash&nbsp;Contribute to multi-vendor enablement - Meta's Edge fleet has run on a single server vendor for many years and we're onboarding alternatives. That means rebuilding provisioning, validation, detection and remediation assumptions that have held for years", "qualifications": "Currently has, or is in the process of obtaining a Bachelor's degree in Computer Science, Computer Engineering, relevant technical field, or equivalent practical experience. Degree must be completed prior to joining Meta&nbsp;2+ years of experience in production systems engineering, infrastructure engineering, network operations, or a related hardware operations discipline&nbsp;2+ years of experience developing automation or tooling in Python, Go, or a comparable scripting or systems programming language for infrastructure or hardware management&nbsp;Experience with server or network hardware components including switches, routers, NICs, and compute platforms, including hands-on troubleshooting and failure analysis&nbsp;Experience with configuration management, fleet management, or hardware lifecycle tooling in a large-scale data center, edge, or cloud infrastructure environment&nbsp;Experience operating or supporting distributed infrastructure across geographically dispersed sites or points of presence Experience with server BMC / iLO / Redfish, firmware upgrade frameworks, or hardware qualification workflows&nbsp;Experience working across time zones and with cross-functional partners in different sites&nbsp;Background in Edge, CDN, or distributed infrastructure. Experience working directly with OEM vendors (e.g., HPE, Dell)&nbsp;Familiarity with large-scale data analysis tools", "identifier": {"@type": "PropertyValue", "name": "Meta", "value": "a1KiE0000002lNpUAI"}, "datePosted": "2026-10-15T08:10:52-07:00"}</script>
