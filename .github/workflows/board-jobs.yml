name: Board job alert

# Complementary discovery pipeline (Greenhouse/Lever/Ashby + ingested local
# LinkedIn/Glassdoor snapshots). Big Company Official runs separately.
# Runs independently from Official and Syncareer. Local LinkedIn/Glassdoor
# snapshot pushes still trigger a board-only ingest without an extra digest.

on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "output/sources/linkedin.json"
      - "output/sources/glassdoor.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: board-jobs
  cancel-in-progress: false

jobs:
  board-scrape-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run board pipeline (LLM on when secret present, else rule fallback)
        id: pipeline
        env:
          # LLM match runs only on rule-filter survivors. If this secret is
          # unset or the API errors, the pipeline falls back to rule scoring
          # and still succeeds (see score_survivors()).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 board_pipeline.py --no-digest
          else
            python3 board_pipeline.py
          fi

      - name: Verify Issue body has no owner mention
        run: |
          if grep -Eiq 'cc[[:space:]]+@daniel-li2021' output/board/issue_body.md 2>/dev/null; then
            echo "Owner mention must not be present in Issue body."
            exit 1
          fi

      - name: Commit board outputs (never sources/*.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only board artifacts + alerts. Local sources are owned by launchd.
          git add output/board/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No board changes to commit."
          else
            git commit -m "chore: board job alert ${{ steps.pipeline.outputs.stamp }}"
            # Rebase on any concurrent local source pushes before pushing back.
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              if git rebase "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to publish after 3 branch-race retries."
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi

      - name: Upload alert artifact
        if: ${{ steps.pipeline.outputs.digest_emitted == '1' && steps.pipeline.outputs.new_count != '0' && steps.pipeline.outputs.new_count != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ats-linkedin-inbox-${{ steps.pipeline.outputs.stamp }}
          path: |
            output/board/inbox.csv
            output/board/inbox.md
            output/board/latest.md
            output/board/runs/${{ steps.pipeline.outputs.stamp }}.csv
          if-no-files-found: ignore

      - name: Open GitHub Issue for new Tier A/B jobs
        # Only alert on manual runs, not on every source push, to avoid
        # spamming issues each time the local scraper syncs. Push runs use
        # --no-digest so keys are not marked alerted without an Issue.
        if: ${{ github.event_name != 'push' && steps.pipeline.outputs.digest_emitted == '1' && steps.pipeline.outputs.new_count != '0' && steps.pipeline.outputs.new_count != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY_PATH="${{ steps.pipeline.outputs.issue_body_path }}"
          if [ -f "$BODY_PATH" ]; then
            gh issue create \
              --title "${{ steps.pipeline.outputs.issue_title }}" \
              --body-file "$BODY_PATH" \
              --label "ats-linkedin-alert" || \
            gh issue create \
              --title "${{ steps.pipeline.outputs.issue_title }}" \
              --body-file "$BODY_PATH"
          else
            echo "No issue body file; skipping issue creation."
          fi
