name: Local source collection

on:
  schedule:
    # Every 3 hours from 5:17 AM through 8:17 PM Pacific; :17 avoids peak queue load.
    - cron: "17 5-20/3 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: local-source-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main with durable source state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-local.txt

      - name: Install local-source dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt

      - name: Collect LinkedIn, Indeed, and Glassdoor
        run: |
          COLLECTOR_COMMIT="$(git rev-parse HEAD)" COLLECTOR_DIRTY=0 python3 local_sources.py

      - name: Commit durable source and health state
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            output/sources/linkedin.json \
            output/sources/indeed.json \
            output/sources/glassdoor.json \
            output/sources/health.json
          python3 scripts/guard_github_blob_size.py
          if git diff --staged --quiet; then
            echo "No local-source changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: local job sources $(date -u +%Y-%m-%d_%H%M)"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to publish after 3 branch-race retries."
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Dispatch Board matching for the committed snapshots
        if: ${{ steps.publish.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run board-jobs.yml --ref main -f source_ingest=true
