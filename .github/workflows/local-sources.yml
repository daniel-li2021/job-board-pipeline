name: Local source collection

run-name: ${{ inputs.scheduler_probe && format('Scheduler probe {0}', inputs.scheduler_probe) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      scheduler_probe:
        description: "Verification receipt only; skip collection and Board dispatch"
        type: string
        default: ""

permissions:
  actions: write
  contents: write

concurrency:
  group: local-source-collection
  cancel-in-progress: false

jobs:
  scheduler-probe:
    if: ${{ inputs.scheduler_probe != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record external scheduler receipt
        env:
          PROBE_ID: ${{ inputs.scheduler_probe }}
        run: printf 'Scheduler probe %s received\n' "$PROBE_ID"

  collect:
    if: ${{ !inputs.scheduler_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main with durable source state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-local.txt

      - name: Install local-source dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt

      - name: Collect and publish source/health snapshots from latest main
        env:
          GIT_CONFIG_COUNT: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/local_source_sync.sh

      - name: Dispatch Board matching for the committed snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run board-jobs.yml --ref main -f source_ingest=true
