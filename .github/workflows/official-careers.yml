name: Official careers

# Independent Big Company Official pipeline. `--only uber` (and similar)
# remains available through workflow_dispatch for adapter diagnostics.

on:
  schedule:
    - cron: "30 8,20 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      only:
        description: "Optional company id (google, amazon, apple, microsoft, nvidia, uber, …)"
        required: false
        default: ""
      no_llm:
        description: "Force rule-based scoring"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: official-careers
  cancel-in-progress: false

jobs:
  official-careers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scrape official careers and match
        id: pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ONLY="${{ github.event.inputs.only }}"
          NO_LLM="${{ github.event.inputs.no_llm }}"
          ARGS=()
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$NO_LLM" = "true" ]; then ARGS+=(--no-llm); fi
          python3 official_careers.py run "${ARGS[@]}"

      - name: Verify Issue body has no owner mention
        run: |
          if grep -Eiq 'cc[[:space:]]+@daniel-li2021' output/alerts/official_issue_body.md 2>/dev/null; then
            echo "Owner mention must not be present in Issue body."
            exit 1
          fi

      - name: Commit official-careers outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- output/official_careers/
          for path in output/alerts/official_*; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if git diff --staged --quiet; then
            echo "No official-careers changes to commit."
          else
            git commit -m "chore: official careers ${{ steps.pipeline.outputs.stamp }}"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              if git rebase "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to publish after 3 branch-race retries."
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi

      - name: Upload digest artifact
        if: ${{ steps.pipeline.outputs.digest_emitted == '1' && steps.pipeline.outputs.new_count != '0' && steps.pipeline.outputs.new_count != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: official-careers-${{ steps.pipeline.outputs.stamp }}
          path: |
            output/alerts/official_${{ steps.pipeline.outputs.stamp }}.csv
            output/official_careers/latest.md
            output/official_careers/scrape_report.md
          if-no-files-found: ignore

      - name: Open GitHub Issue digest (at most once per day)
        if: ${{ steps.pipeline.outputs.digest_emitted == '1' && steps.pipeline.outputs.new_count != '0' && steps.pipeline.outputs.new_count != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY_PATH="${{ steps.pipeline.outputs.issue_body_path }}"
          if [ -f "$BODY_PATH" ]; then
            gh issue create \
              --title "${{ steps.pipeline.outputs.issue_title }}" \
              --body-file "$BODY_PATH" \
              --label "job-alert" || \
            gh issue create \
              --title "${{ steps.pipeline.outputs.issue_title }}" \
              --body-file "$BODY_PATH"
          else
            echo "No issue body file; skipping issue creation."
          fi
