name: Daily job alert

# This repo's root is the job_scrape_feasibility folder, so daily_pipeline.py
# and output/ live at the repo root (no working-directory needed).

on:
  schedule:
    # GitHub cron is always UTC. These target ~07:00 and ~19:00 US Pacific
    # (drifts by 1h across DST, which is fine for a job alert).
    - cron: "0 15 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      time_window:
        description: "Syncareer time window"
        default: "last3days"
        type: choice
        options: [24hours, last3days, last7days]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run pipeline (alert mode, hard filters only)
        id: pipeline
        run: |
          python3 daily_pipeline.py --alert --no-llm --time "${{ inputs.time_window || 'last3days' }}"

      - name: Commit watchlist and alerts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/watchlist.json output/alerts/ output/daily/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily job alert ${{ steps.pipeline.outputs.stamp }}"
            git push
          fi

      - name: Upload alert artifacts
        if: ${{ steps.pipeline.outputs.new_count != '0' && steps.pipeline.outputs.new_count != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: job-alert-${{ steps.pipeline.outputs.stamp }}
          path: |
            output/alerts/${{ steps.pipeline.outputs.stamp }}.csv
            output/alerts/${{ steps.pipeline.outputs.stamp }}.txt
          if-no-files-found: ignore

      - name: Open GitHub Issue with new jobs
        if: ${{ steps.pipeline.outputs.new_count != '0' && steps.pipeline.outputs.new_count != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY_PATH="${{ steps.pipeline.outputs.issue_body_path }}"
          if [ -f "$BODY_PATH" ]; then
            gh issue create \
              --title "${{ steps.pipeline.outputs.issue_title }}" \
              --body-file "$BODY_PATH" \
              --label "job-alert" || \
            gh issue create \
              --title "${{ steps.pipeline.outputs.issue_title }}" \
              --body-file "$BODY_PATH"
          else
            echo "No issue body file; skipping issue creation."
          fi
