name: Syncareer job alert

# Writes only under output/syncareer/. Never touches output/board/.

on:
  schedule:
    - cron: "20 15 * * *"
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      time_window:
        description: "Syncareer time window"
        default: "last3days"
        type: choice
        options: [24hours, last3days, last7days]

permissions:
  contents: write
  issues: write

concurrency:
  group: syncareer-jobs
  cancel-in-progress: false

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Syncareer pipeline (alert mode, hard filters only)
        id: pipeline
        run: |
          python3 daily_pipeline.py --alert --no-llm --time "${{ inputs.time_window || 'last3days' }}"

      - name: Commit Syncareer inbox and watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/syncareer/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No Syncareer changes to commit."
          else
            git commit -m "chore: syncareer alert ${{ steps.pipeline.outputs.stamp }}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload Syncareer inbox + this-run snapshot
        uses: actions/upload-artifact@v4
        with:
          name: syncareer-inbox-${{ steps.pipeline.outputs.stamp }}
          path: |
            output/syncareer/inbox.csv
            output/syncareer/inbox.md
            output/syncareer/inbox.txt
            output/syncareer/runs/${{ steps.pipeline.outputs.stamp }}.csv
            output/syncareer/runs/${{ steps.pipeline.outputs.stamp }}.txt
          if-no-files-found: ignore

      - name: Open GitHub Issue for this run
        if: ${{ steps.pipeline.outputs.new_count != '0' && steps.pipeline.outputs.new_count != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY_PATH="${{ steps.pipeline.outputs.issue_body_path }}"
          if [ -f "$BODY_PATH" ]; then
            gh issue create \
              --title "${{ steps.pipeline.outputs.issue_title }}" \
              --body-file "$BODY_PATH" \
              --label "syncareer-alert" || \
            gh issue create \
              --title "${{ steps.pipeline.outputs.issue_title }}" \
              --body-file "$BODY_PATH"
          fi
