name: Syncareer job alert

# Writes only under output/syncareer/. Never touches output/board/.

run-name: ${{ inputs.scheduler_probe && format('Scheduler probe {0}', inputs.scheduler_probe) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      scheduler_probe:
        description: "Verification receipt only; skip crawling, scoring, and alerts"
        type: string
        default: ""
      time_window:
        description: "Syncareer time window"
        default: "last3days"
        type: choice
        options: [24hours, last3days, last7days]

permissions:
  contents: write
  issues: write

concurrency:
  group: syncareer-jobs
  cancel-in-progress: false

jobs:
  scheduler-probe:
    if: ${{ inputs.scheduler_probe != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record external scheduler receipt
        env:
          PROBE_ID: ${{ inputs.scheduler_probe }}
        run: printf 'Scheduler probe %s received\n' "$PROBE_ID"
  scrape-and-alert:
    if: ${{ !inputs.scheduler_probe }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Syncareer pipeline (shared LLM scoring with rule fallback)
        id: pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 daily_pipeline.py --alert --time "${{ inputs.time_window || 'last3days' }}"

      - name: Commit Syncareer inbox and watchlist
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- output/syncareer/
          if [ -f output/recovery/syncareer.json.gz ]; then git add -- output/recovery/syncareer.json.gz; fi
          python3 scripts/guard_github_blob_size.py
          if git diff --staged --quiet; then
            echo "No Syncareer changes to commit."
          else
            git commit -m "chore: syncareer alert ${{ steps.pipeline.outputs.stamp }}"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              if git rebase "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to publish after 3 branch-race retries."
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi

      - name: Upload Syncareer inbox + this-run snapshot
        uses: actions/upload-artifact@v4
        with:
          name: syncareer-inbox-${{ steps.pipeline.outputs.stamp }}
          path: |
            output/syncareer/inbox.csv
            output/syncareer/inbox.md
            output/syncareer/inbox.txt
            output/syncareer/runs/${{ steps.pipeline.outputs.stamp }}.csv
            output/syncareer/runs/${{ steps.pipeline.outputs.stamp }}.txt
          if-no-files-found: ignore

      - name: Deliver pending Issue digests
        id: delivery
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 notification_outbox.py syncareer --repo "$GH_REPO"

      - name: Persist delivery acknowledgements
        if: ${{ always() && steps.publish.outcome == 'success' && steps.delivery.outcome != 'skipped' }}
        run: |
          RECEIPT="output/syncareer/notification_outbox.json"
          if [ ! -f "$RECEIPT" ]; then exit 0; fi
          git add -- "$RECEIPT"
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: acknowledge syncareer digest delivery"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase "origin/$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
