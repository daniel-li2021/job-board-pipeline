name: Scheduled job pipelines

# Morning + evening: ATS board then official careers, one commit of both
# output trees. LinkedIn/Glassdoor stay local (launchd). Syncareer stays
# in daily-jobs.yml.

on:
  schedule:
    # GitHub cron is UTC. ~07:00 and ~19:00 US Pacific.
    - cron: "0 15 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Which pipeline(s) to run"
        type: choice
        options: [both, board, official]
        default: both
      only:
        description: "Official-careers company id(s), comma-separated (uber, google, …)"
        required: false
        default: ""
      no_llm:
        description: "Force rule-based scoring"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: scheduled-job-pipelines
  cancel-in-progress: false

jobs:
  board-then-official:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run board pipeline
        id: board
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.pipeline != 'official' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 board_pipeline.py

      - name: Run official careers
        id: official
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.pipeline != 'board' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ONLY="${{ github.event.inputs.only }}"
          NO_LLM="${{ github.event.inputs.no_llm }}"
          ARGS=()
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$NO_LLM" = "true" ]; then ARGS+=(--no-llm); fi
          python3 official_careers.py run "${ARGS[@]}"

      - name: Commit board + official-careers outputs
        if: ${{ !cancelled() && (steps.board.outcome == 'success' || steps.official.outcome == 'success') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/board/ output/official_careers/ 2>/dev/null || true
          git add output/alerts/official_* output/alerts/official_issue_body.md 2>/dev/null || true
          STAMP="${{ steps.board.outputs.stamp }}"
          if [ -z "$STAMP" ]; then STAMP="${{ steps.official.outputs.stamp }}"; fi
          if git diff --staged --quiet; then
            echo "No pipeline output changes to commit."
          else
            git commit -m "chore: scheduled jobs ${STAMP}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload board inbox artifact
        if: ${{ steps.board.outcome == 'success' && steps.board.outputs.digest_emitted == '1' && steps.board.outputs.new_count != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: ats-linkedin-inbox-${{ steps.board.outputs.stamp }}
          path: |
            output/board/inbox.csv
            output/board/inbox.md
            output/board/latest.md
            output/board/runs/${{ steps.board.outputs.stamp }}.csv
          if-no-files-found: ignore

      - name: Upload official-careers digest artifact
        if: ${{ steps.official.outcome == 'success' && steps.official.outputs.digest_emitted == '1' && steps.official.outputs.new_count != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: official-careers-${{ steps.official.outputs.stamp }}
          path: |
            output/alerts/official_${{ steps.official.outputs.stamp }}.csv
            output/official_careers/latest.md
            output/official_careers/scrape_report.md
          if-no-files-found: ignore

      - name: Open board GitHub Issue
        if: ${{ steps.board.outcome == 'success' && steps.board.outputs.digest_emitted == '1' && steps.board.outputs.new_count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY_PATH="${{ steps.board.outputs.issue_body_path }}"
          if [ -f "$BODY_PATH" ]; then
            gh issue create \
              --title "${{ steps.board.outputs.issue_title }}" \
              --body-file "$BODY_PATH" \
              --label "ats-linkedin-alert" || \
            gh issue create \
              --title "${{ steps.board.outputs.issue_title }}" \
              --body-file "$BODY_PATH"
          else
            echo "No board issue body file; skipping issue creation."
          fi

      - name: Open official-careers GitHub Issue
        if: ${{ steps.official.outcome == 'success' && steps.official.outputs.digest_emitted == '1' && steps.official.outputs.new_count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY_PATH="${{ steps.official.outputs.issue_body_path }}"
          if [ -f "$BODY_PATH" ]; then
            gh issue create \
              --title "${{ steps.official.outputs.issue_title }}" \
              --body-file "$BODY_PATH" \
              --label "job-alert" || \
            gh issue create \
              --title "${{ steps.official.outputs.issue_title }}" \
              --body-file "$BODY_PATH"
          else
            echo "No official-careers issue body file; skipping issue creation."
          fi
