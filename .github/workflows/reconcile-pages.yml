name: Reconcile and publish dashboard

on:
  workflow_run:
    workflows: ["Official careers", "Board job alert", "Syncareer job alert"]
    types: [completed]
  schedule:
    - cron: "30 15 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: reconcile-pages
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Reconcile coverage and generate dashboard
        run: |
          python3 coverage_reconcile.py
          python3 dashboard.py --json

      - name: Commit only reconciliation and dashboard artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/cross_pipeline/ public/
          if git diff --staged --quiet; then
            echo "No reconciliation/dashboard changes to commit."
          else
            git commit -m "chore: refresh coverage dashboard"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
