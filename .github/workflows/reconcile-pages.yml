name: Reconcile and publish dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reconcile-pages.yml"
      - "profile/official_coverage.json"
      - "config/official_careers.json"
      - "config/target_companies.json"
      - "dashboard.py"
      - "pipeline_health.py"
      - "dashboard_applied_history.js"
      - "dashboard_last7.js"
      - "coverage_reconcile.py"
      - "alert_history.py"
      - "board_pipeline.py"
      - "llm_config.py"
      - "state_io.py"
      - "sources/**"
      - "profile/company_filters.json"
      - "requirements.txt"
  workflow_run:
    workflows: ["Official careers", "Board job alert", "Syncareer job alert"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reconcile-pages
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconcile coverage and generate dashboard
        env:
          PIPELINE_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          PIPELINE_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PIPELINE_WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 coverage_reconcile.py
          python3 dashboard.py --json

      - name: Add dashboard runtime extensions
        run: |
          cp dashboard_applied_history.js public/dashboard_applied_history.js
          cp dashboard_last7.js public/dashboard_last7.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path("public/index.html")
          html = path.read_text(encoding="utf-8")
          marker = "</body></html>"
          scripts = [
              '<script src="dashboard_applied_history.js"></script>',
              '<script src="dashboard_last7.js"></script>',
          ]
          if marker not in html:
              raise SystemExit("dashboard closing marker not found")
          for script in scripts:
              if script not in html:
                  html = html.replace(marker, script + marker, 1)
          path.write_text(html, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
